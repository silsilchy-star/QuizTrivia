# « 임시 진단용 워크플로 — 확인이 끝나면 삭제한다 »
#
# "커뮤니티 주제가 언제, 왜 사라졌는가"를 추측이 아니라 사실로 확정하기 위한
# 일회용이다. 프로덕션에는 붙지 않는다 — 이미 GitHub에 보관된 D1 백업
# 아티팩트를 내려받아 읽기만 한다.
#
# 배포 워크플로를 건드리지 않으려고 별도 파일로 뒀다. 이 브랜치에 push할 때만
# 돌고, main에는 영향이 없다.
name: (임시) 백업 대조

on:
  push:
    branches:
      - claude/handover-understanding-bz9z8q

permissions:
  contents: read
  actions: read # 다른 실행의 아티팩트를 내려받으려면 필요하다

jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 이 세션이 DB를 처음 건드리기 직전(14:10). 그 전 상태를 담고 있다.
          - label: "① 14:10  282f18a (이 세션 첫 배포 직전)"
            run_id: "31708733279"
            artifact: d1-backup-282f18a91e01b7325bfa9f99a807f05a08436066
          # 스키마 통합 + 세션 서명 배포 직전(14:47)
          - label: "② 14:47  3bb00ae (스키마 통합 배포 직전)"
            run_id: "31711799646"
            artifact: d1-backup-3bb00aee6acfdbd7f6d2b1c97a0ba8db51da3bb0
          # 가장 최근(15:17)
          - label: "③ 15:17  e41c6a1 (최근)"
            run_id: "31714528208"
            artifact: d1-backup-e41c6a1c3d871cd6de7281883ac3a5d4c762e328
    steps:
      - name: 백업 내려받기 — ${{ matrix.label }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backup

      # grep으로 세지 않는다 — D1 export의 INSERT 형식을 넘겨짚으면 틀린다
      # (실제로 처음엔 runs/users가 0으로 잘못 나왔다). 백업을 진짜 SQLite에
      # 적재해서 쿼리한다.
      - name: 커뮤니티 데이터 세기 — ${{ matrix.label }}
        run: |
          set -euo pipefail
          sqlite3 snapshot.db < backup/d1-backup.sql
          echo "=============================================="
          echo "  ${{ matrix.label }}"
          echo "=============================================="
          echo "백업 크기: $(wc -c < backup/d1-backup.sql) bytes"
          echo
          sqlite3 -header -column snapshot.db "
            SELECT
              (SELECT COUNT(*) FROM topics WHERE source='community')        AS 커뮤니티주제,
              (SELECT COUNT(*) FROM questions WHERE author_uid IS NOT NULL) AS 커뮤니티문항,
              (SELECT COUNT(*) FROM users)                                  AS 유저,
              (SELECT COUNT(*) FROM runs)                                   AS 플레이기록,
              (SELECT COUNT(*) FROM topic_best)                             AS 주제최고점;"
          echo
          echo "--- 커뮤니티 주제 목록 ---"
          sqlite3 -header -column snapshot.db "
            SELECT name, status, created_at,
                   (SELECT COUNT(*) FROM question_topics qt WHERE qt.topic_id = t.id) AS 문항수
              FROM topics t WHERE source='community' ORDER BY created_at;"
