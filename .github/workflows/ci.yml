name: CI

# 모든 브랜치와 PR에서 돈다. 배포 워크플로와 분리한 이유는, 배포 권한(시크릿)이
# 없는 상태에서도 검증만은 항상 돌아야 하기 때문이다.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (프론트 + 워커)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate question data
        run: npm run validate

      - name: Build seed from JSON
        run: npm run build:seed

      # wrangler deploy는 타입체크를 하지 않는다. dry-run으로 워커가 실제로
      # 번들되는지까지 확인해야 "배포는 성공했는데 워커가 안 뜨는" 상황을 막는다.
      - name: Build frontend
        run: npm run build
      - name: Bundle worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/worker-dry-run
