name: Create D1 Database (one-off)

on:
  workflow_dispatch:

jobs:
  create-d1:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      # Probe which scopes the API token actually carries, so a failure below
      # points at a specific missing permission instead of a generic auth error.
      - name: Probe API token permissions
        run: |
          probe() {
            code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$2")
            echo "$1 -> HTTP $code"
            if [ "$code" != "200" ]; then
              jq -c '.errors' /tmp/resp.json 2>/dev/null || true
            fi
          }
          BASE=https://api.cloudflare.com/client/v4
          ACC=$BASE/accounts/$CLOUDFLARE_ACCOUNT_ID
          probe "token verify   " "$BASE/user/tokens/verify"
          probe "D1 list        " "$ACC/d1/database"
          probe "KV list        " "$ACC/storage/kv/namespaces"
          probe "Workers scripts" "$ACC/workers/scripts"

      - name: Create quiztrivia D1 database
        run: npx wrangler d1 create quiztrivia
