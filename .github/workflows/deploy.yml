name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 배포가 겹치면 두 실행이 같은 D1에 동시에 마이그레이션을 걸 수 있다.
# 한 번에 하나만 돌리고, 진행 중인 배포는 취소하지 않는다(DB 작업 중간에
# 끊기는 것이 더 위험하다).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # step의 if에서는 secrets 컨텍스트를 쓸 수 없다(워크플로 파싱이 실패한다).
      # env로 한 번 받아두면 if에서 볼 수 있다.
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # ── 1) 프로덕션 DB를 건드리기 전에 코드가 성립하는지 전부 확인한다 ──
      #
      # 예전 순서는 D1 스키마/마이그레이션을 먼저 적용하고 빌드를 나중에 했다.
      # 그래서 워커에 타입 에러가 있으면 "DB는 이미 새 스키마, 워커는 옛 버전"인
      # 어긋난 상태로 서비스가 남았다. 검증을 전부 앞으로 당긴다.
      - name: Typecheck (프론트 + 워커)
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Validate question data
        run: npm run validate
      - name: Build seed from JSON
        run: npm run build:seed
      - name: Build frontend
        run: npm run build
      - name: Bundle worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/worker-dry-run

      # ── 2) DB를 바꾸기 직전에 통째로 받아둔다 ──
      #
      # D1의 Time Travel(30일)이 있지만, 손에 잡히는 복구 수단이 하나는 있어야
      # 한다. 2026-08-13 schema.sql DROP 사고 때 이게 없었다.
      # (docs/2026-08-13-critical-schema-drop-fix.md)
      - name: Backup production D1
        run: npx wrangler d1 export quiztrivia --remote --output=d1-backup.sql --skip-confirmation
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.sha }}
          path: d1-backup.sql
          retention-days: 30

      # DB를 바꾸기 직전의 개수. 아래 배포 후 수치와 짝을 이뤄, 어떤 단계가
      # 데이터를 건드렸는지 배포 로그만으로 판별할 수 있게 한다.
      # (UNION ALL로 쌓으면 D1의 compound SELECT 항 수 제한에 걸린다 —
      #  스칼라 서브쿼리로 한 행에 담는다.)
      #
      # ⚠ 이 쿼리는 schema 적용 **전**에 돈다. 그러니 여기서는 프로덕션에
      #   이미 존재하는 테이블만 조회해야 한다. 새로 추가한 테이블은 아직
      #   만들어지지 않았으므로 아래 (after) 쪽에만 넣는다.
      #   (error_log를 여기 넣었다가 'no such table'로 배포가 멈춘 적 있음)
      - name: Count rows (before)
        run: npx wrangler d1 execute quiztrivia --remote --yes --command "SELECT (SELECT COUNT(*) FROM topics WHERE source='official' AND status='active') AS official_active, (SELECT COUNT(*) FROM topics WHERE source='community') AS community_topics, (SELECT COUNT(*) FROM questions WHERE author_uid IS NOT NULL) AS community_questions, (SELECT COUNT(*) FROM questions WHERE author_uid IS NULL) AS official_questions, (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM users WHERE google_sub IS NOT NULL) AS users_linked, (SELECT COUNT(*) FROM runs) AS runs, (SELECT COUNT(*) FROM topic_best) AS topic_best"

      # ── 3) 여기서부터 프로덕션 DB가 실제로 바뀐다 ──
      - name: Apply D1 schema (멱등 베이스라인)
        run: npx wrangler d1 execute quiztrivia --remote --yes --file=db/schema.sql
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply quiztrivia --remote
      - name: Apply D1 seed
        run: npx wrangler d1 execute quiztrivia --remote --yes --file=db/seed.generated.sql

      # ── 4) 배포 ──
      - name: Set Google OAuth secrets
        run: |
          echo "${{ secrets.GOOGLE_CLIENT_ID }}" | npx wrangler secret put GOOGLE_CLIENT_ID
          echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_CLIENT_SECRET

      # 세션 쿠키 서명용 비밀키. 아직 설정 전이면 건너뛴다 — 워커는 비밀키가
      # 없으면 서명 없이(옛 방식으로) 동작하므로 배포가 깨지지 않는다.
      # ⚠ 이 비밀키를 바꾸면 모든 세션이 무효가 되어 전원 로그아웃된다.
      - name: Set session signing secret
        if: env.SESSION_SECRET != ''
        run: echo "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
      - name: Deploy Worker
        run: npx wrangler deploy

      # 배포 후 개수 + 커뮤니티 주제 목록. 위 "Count rows (before)"와 비교하면
      # 이번 배포가 사용자 데이터를 건드렸는지 바로 보인다.
      - name: Count rows (after)
        run: npx wrangler d1 execute quiztrivia --remote --yes --command "SELECT (SELECT COUNT(*) FROM topics WHERE source='official' AND status='active') AS official_active, (SELECT COUNT(*) FROM topics WHERE source='community') AS community_topics, (SELECT COUNT(*) FROM questions WHERE author_uid IS NOT NULL) AS community_questions, (SELECT COUNT(*) FROM questions WHERE author_uid IS NULL) AS official_questions, (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM users WHERE google_sub IS NOT NULL) AS users_linked, (SELECT COUNT(*) FROM runs) AS runs, (SELECT COUNT(*) FROM topic_best) AS topic_best, (SELECT COUNT(*) FROM error_log) AS errors"
      - name: List community topics
        run: npx wrangler d1 execute quiztrivia --remote --yes --command "SELECT name, status, created_at, q_count_1, q_count_2, q_count_3, q_count_4 FROM topics WHERE source='community' ORDER BY created_at"
