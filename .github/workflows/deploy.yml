name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - claude/repo-permissions-check-ff2du7
      - claude/handover-matters-review-gs5597
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate questions
        run: npm run validate
      - name: Apply D1 schema
        run: npx wrangler d1 execute quiztrivia --remote --yes --file=db/schema.sql
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply quiztrivia --remote
      - name: Build seed from JSON
        run: npm run build:seed
      - name: Apply D1 seed
        run: npx wrangler d1 execute quiztrivia --remote --yes --file=db/seed.generated.sql
      - name: Build frontend
        run: npm run build
      - name: Set Google OAuth secrets
        run: |
          echo "${{ secrets.GOOGLE_CLIENT_ID }}" | npx wrangler secret put GOOGLE_CLIENT_ID
          echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_CLIENT_SECRET
      - name: Deploy Worker
        run: npx wrangler deploy
