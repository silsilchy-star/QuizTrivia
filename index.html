<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizTrivia</title>
<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: system-ui, sans-serif;
    background: #f5f5f7;
  }
  #score {
    font-size: 48px;
    font-weight: bold;
  }
  button {
    font-size: 20px;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
  }
  button:active {
    background: #2563eb;
  }
</style>
</head>
<body>
  <div id="score">Score: 0</div>
  <button id="hello-btn">Hello</button>

  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    document.getElementById('hello-btn').addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = `Score: ${score}`;
    });
  </script>
</body>
</html>
