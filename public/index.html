<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizTrivia</title>
<style>
  body {
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: system-ui, sans-serif;
    background: #f5f5f7;
  }
  #score {
    font-size: 48px;
    font-weight: bold;
  }
  button {
    font-size: 20px;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
  }
  button:active {
    background: #2563eb;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
</style>
</head>
<body>
  <div id="score">Score: -</div>
  <button id="hello-btn" disabled>Hello</button>

  <script>
    const scoreEl = document.getElementById('score');
    const btn = document.getElementById('hello-btn');

    async function loadScore() {
      const res = await fetch('/api/score');
      const data = await res.json();
      scoreEl.textContent = `Score: ${data.score}`;
      btn.disabled = false;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const res = await fetch('/api/score', { method: 'POST' });
      const data = await res.json();
      scoreEl.textContent = `Score: ${data.score}`;
      btn.disabled = false;
    });

    loadScore();
  </script>
</body>
</html>
